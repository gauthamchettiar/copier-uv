repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      
      - id: pytest-cov
        name: pytest-cov (coverage check)
        entry: uv run pytest --cov --cov-fail-under=80
        language: system
        pass_filenames: false
        always_run: true
        files: ^$
