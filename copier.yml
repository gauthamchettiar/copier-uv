# Copier template configuration
_templates_suffix: .jinja
_subdirectory: project
_answers_file: .copier-answers.yml
_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions.py:GitExtension
  - extensions.py:SlugifyExtension

master_versions:
  type: json
  when: false
  default: ["3.10", "3.11", "3.12", "3.13"] # make sure to keep them sorted

project_name:
  type: str
  help: What is your project name?
  default: "{{ _copier_conf.dst_path.name }}"

project_slug:
  type: str
  help: What is the Python package name (slug)?
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"

project_description:
  type: str
  help: Project description
  default: "A short description of the project."

author_name:
  type: str
  help: Author name
  default: "{{ 'Your Name' | git_user_name }}"

author_email:
  type: str
  help: Author email
  default: "{{ 'your.name@example.com' | git_user_email }}"

author_username:
  type: str
  help: Author Repository username (for example, your GitHub username)
  default: "{{ author_name | lower | replace(' ', '') }}"

repository_provider:
  type: str
  help: Your repository provider
  default: github
  choices:
  - github

repository_namespace:
  type: str
  help: Your repository namespace (defaults to your repository username)
  default: "{{ author_username }}"

repository_name:
  type: str
  help: Your repository name
  default: "{{ project_slug | slugify }}"

min_python_version:
  type: str
  help: Minimum Python version
  default: "{{ master_versions[-1] }}"
  choices: "{{ master_versions }}"

supported_python_versions:
  type: json
  when: false
  default: >-
    {% set ns = namespace(found=false, versions=[]) %}
    {% for v in master_versions %}
      {% if v == min_python_version %}{% set ns.found = true %}{% endif %}
      {% if ns.found %}{% set ns.versions = ns.versions + [v] %}{% endif %}
    {% endfor %}
    {{ ns.versions | tojson }}

license:
  type: str
  help: Choose a license
  default: "MIT"
  choices:
    - "MIT"
    - "Apache-2.0"
    - "BSD-3-Clause"
    - "GPL-3.0"
    - "MPL-2.0"

copyright_year:
  type: str
  help: Copyright year
  default: "{{ '%Y' | strftime }}"

example:
  type: str
  help: Choose an example module
  default: "hello"
  choices:
    - "hello"
    - "calculator"
