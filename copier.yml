# Copier template configuration
_templates_suffix: .jinja
_subdirectory: project
_answers_file: .copier-answers.yml

master_versions:
  type: json
  when: false
  default: ["3.10", "3.11", "3.12", "3.13", "3.14"] # make sure to keep them sorted

project_name:
  type: str
  help: What is your project name?
  default: my-project

project_slug:
  type: str
  help: What is the Python package name (slug)?
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"

project_description:
  type: str
  help: Project description
  default: Add your description here.

author_name:
  type: str
  help: Author name
  default: "Your Name"

author_email:
  type: str
  help: Author email
  default: "your.email@example.com"

min_python_version:
  type: str
  help: Minimum Python version
  default: "{{ master_versions[-1] }}"
  choices: "{{ master_versions }}"

supported_python_versions:
  type: json
  when: false
  default: >-
    {% set ns = namespace(found=false, versions=[]) %}
    {% for v in master_versions %}
      {% if v == min_python_version %}{% set ns.found = true %}{% endif %}
      {% if ns.found %}{% set ns.versions = ns.versions + [v] %}{% endif %}
    {% endfor %}
    {{ ns.versions | tojson }}

license:
  type: str
  help: Choose a license
  default: "MIT"
  choices:
    - "MIT"
    - "Apache-2.0"
    - "BSD-3-Clause"
    - "GPL-3.0"
    - "MPL-2.0"

year:
  type: str
  help: Copyright year
  default: "2026"

example:
  type: str
  help: Choose an example module
  default: "hello"
  choices:
    - "hello"
    - "calculator"
