[project]
name = "copier-uv"
version = "0.1.0"
description = "A Copier template for Python projects using UV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]
only-include = ["tests", "copier.yml", "extensions.py", "project"]

[dependency-groups]
dev = [
    "copier>=9.11.3",
    "copier-templates-extensions>=0.3.2",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
